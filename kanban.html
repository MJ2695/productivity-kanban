    }

    function renderBoard(status) {
      const filtered = TASKS.filter(t => t.status === status && (status !== 'done' || isDoneRecent(t)));
      const board = document.createElement('div');
      board.className = 'board';
      
      const title = document.createElement('div');
      title.className = `board-title ${status}`;
      title.textContent = status.charAt(0).toUpperCase() + status.slice(1) + ` (${filtered.length})`;
      board.appendChild(title);
      
      const tasks = document.createElement('div');
      tasks.className = 'tasks';
      
      if (filtered.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'no-tasks';
        empty.textContent = 'No tasks';
        tasks.appendChild(empty);
      } else {
        filtered.forEach(task => {
          const el = document.createElement('div');
          el.className = `task ${task.status}`;
          
          let html = `<div class="task-title">${escapeHtml(task.title)}</div>`;
          html += `<div class="task-meta">`;
          html += `<span class="badge ${task.priority.quadrant}">${task.priority.quadrant}</span>`;
          html += `<span class="badge ${task.priority.abcde}">${task.priority.abcde}</span>`;
          if (task.deadline.date) {
            html += `<span class="deadline">${formatDeadline(task)}</span>`;
          }
          html += `</div>`;
          
          el.innerHTML = html;
          tasks.appendChild(el);
        });
      }
      board.appendChild(tasks);
      return board;
    }

    function isDoneRecent(task) {
      if (!task.done_at) return false;
      const done = new Date(task.done_at);
      const now = new Date('2026-06-03');
      const days = Math.floor((now - done) / (1000 * 60 * 60 * 24));
      return days <= 7;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    window.addEventListener('load', () => {
      const boards = document.querySelector('.boards');
      boards.appendChild(renderBoard('inbox'));
      boards.appendChild(renderBoard('active'));
      boards.appendChild(renderBoard('snoozed'));
      boards.appendChild(renderBoard('done'));
    });
  </script>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Task Board</h1>
      <p>Updated: <code id="timestamp"></code></p>
    </div>
    <div class="boards"></div>
    <div class="goals-section">
      <h2>Active Goals</h2>
      <div id="goals"></div>
    </div>
  </div>
  <script>
    document.getElementById('timestamp').textContent = GENERATED_AT;
    GOALS.filter(g => g.status === 'active').forEach(goal => {
      const el = document.createElement('div');
      el.className = 'goal';
      el.innerHTML = `<div class="goal-title">${escapeHtml(goal.title)}</div><div class="goal-status">Target: ${goal.target_date}</div>`;
      document.getElementById('goals').appendChild(el);
    });
  </script>
</body>
</html>
